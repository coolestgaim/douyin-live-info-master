<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直播画面预览</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #ddd; font: 13px system-ui; overflow: hidden; }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px; background: #111318; border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .pill { background: #1f2937; border: 1px solid #2a2a2a; border-radius: 12px; padding: 3px 10px; font-size: 12px; }
    .pill.cyan { color: #35d3c4; border-color: #2d6f6a; }
    .pill.red { color: #f0506e; border-color: #5a2a36; }
    .room { font-weight: 600; color: #fff; font-size: 13px; }
    .state { color: #9aa0a6; font-size: 12px; flex: 1; }
    .state.ok { color: #35d3c4; }
    .state.err { color: #f0506e; }
    button.close {
      background: transparent; color: #ddd; border: 1px solid #3a3a3a; border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-size: 12px;
    }
    button.close:hover { background: #f0506e; border-color: #f0506e; color: #fff; }
    video { flex: 1; width: 100%; height: 100%; background: #000; object-fit: contain; }
  </style>
  <script src="/lib/hls.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="room" id="room">直播间</span>
      <span class="pill cyan" id="latency">延迟 -</span>
      <span class="state" id="state">连接中…</span>
      <button class="close" onclick="window.close()">关闭</button>
    </header>
    <video id="v" autoplay muted playsinline controls></video>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search)
      const roomId = params.get('roomId') || ''
      const m3u8Url = params.get('m3u8') || ''
      document.getElementById('room').textContent = '房间 ' + roomId
      const v = document.getElementById('v')
      const stateEl = document.getElementById('state')
      const latEl = document.getElementById('latency')
      const setState = (s, cls) => { stateEl.textContent = s; stateEl.className = 'state' + (cls ? ' ' + cls : '') }
      const m3u8Base = (m3u8Url || '').split('?')[0]
      if (!m3u8Base) { setState('缺少 m3u8 URL 参数', 'err'); return }

      let hls = null
      let retryTimer = null
      let backoff = 800                      // 指数退避起点：800ms → 翻倍 → 封顶 10s
      let failCount = 0                      // 连续失败计数，成功播出一片即清零
      const MAX_BACKOFF = 10000
      const RECREATE_AFTER_NONFATAL = 5

      const freshUrl = () => m3u8Base + '?t=' + Date.now()

      function destroyPlayer() {
        if (hls) { try { hls.destroy() } catch (e) {} hls = null }
      }

      function createPlayer() {
        destroyPlayer()
        setState('连接中…', '')
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ liveDurationInfinity: true, liveSyncDurationCount: 3, lowLatencyMode: false })
          hls.on(Hls.Events.MANIFEST_PARSED, () => { setState('已连接，画面输出中…', '') })
          hls.on(Hls.Events.FRAG_BUFFERED, () => { failCount = 0; backoff = 800; if (stateEl.textContent.indexOf('已出') < 0) setState('画面已出 ✓', 'ok') })
          hls.on(Hls.Events.ERROR, (_e, d) => onError(d))
          hls.loadSource(freshUrl())
          hls.attachMedia(v)
          v.play().catch(() => { /* muted 仍可能被部分环境拦，无害 */ })
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = freshUrl()
          v.addEventListener('loadedmetadata', () => setState('画面已出 ✓', 'ok'))
        } else {
          setState('当前环境不支持 HLS', 'err')
        }
      }

      // B 修复：fatal 不再只调 hls.startLoad()（失败状态残留会原地打转、表现为"一直断流重连"），
      // 改为销毁重建播放器 + 指数退避 + URL 带 ?t= 缓存戳，让重连真正从"最新清单"重新开始。
      function scheduleRecreate(msg) {
        setState(msg || '断流，自动重连中…', 'err')
        if (retryTimer) return
        const wait = backoff
        backoff = Math.min(backoff * 2, MAX_BACKOFF)
        retryTimer = setTimeout(() => { retryTimer = null; createPlayer() }, wait)
      }

      function onError(d) {
        if (!d) return
        failCount++
        if (!d.fatal) {
          // 非致命错误（如个别切片抖动）：连续多次仍失败就整体重建一次
          if (failCount >= RECREATE_AFTER_NONFATAL) scheduleRecreate('切片连续加载失败，正在重建…')
          return
        }
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          // 解码类错误先轻量恢复一次，仍不行则重建
          if (failCount <= 2 && hls) { try { hls.recoverMediaError() } catch (e) {} return }
          scheduleRecreate('画面解码异常，正在重建…')
          return
        }
        scheduleRecreate('断流，自动重连中…')
      }

      setInterval(() => {
        try { if (hls && hls.latency !== undefined) latEl.textContent = '延迟 ' + hls.latency.toFixed(1) + 's' } catch (e) {}
      }, 1000)

      createPlayer()
    })()
  </script>
</body>
</html>
