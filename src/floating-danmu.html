<!DOCTYPE html>
<html class="theme-dark">
<head>
<meta charset="utf-8">
<style>
/* 主题变量：与主窗口 tokens.css 同步；主进程通知时切换 .theme-* */
:root {
  --bg-window: rgba(20, 22, 28, 0.92);
  --bg-card: #1a1d26;
  --bg-track: #111318;
  --bg-hover: rgba(240, 80, 110, 0.06);
  --bg-active: rgba(240, 80, 110, 0.1);
  --border-default: #1e2028;
  --border-strong: #2a2d36;
  --text-primary: #e0e2e8;
  --text-secondary: #8b8fa3;
  --text-muted: #6b7080;
  --text-faint: #4a4e5e;
  --text-dim: #3a3d46;
  --primary: #f0506e;
  --primary-hover: #f26b84;
  --primary-soft: rgba(240, 80, 110, 0.12);
  --primary-border: rgba(240, 80, 110, 0.35);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, 0.1);
  --danger-border: rgba(229, 72, 77, 0.3);
  --success: #4cc38a;
  --success-soft: rgba(76, 195, 138, 0.14);
  --accent-cyan: #35d3c4;
  --accent-cyan-soft: rgba(53, 211, 196, 0.14);
  --info: #5b9bf0;
  --info-soft: rgba(91, 155, 240, 0.14);
  --warning: #e9b949;
  --warning-soft: rgba(233, 185, 73, 0.12);
  --like: #ef6096;
  --like-soft: rgba(239, 96, 150, 0.14);
  --on-primary: #ffffff;
  --radius-md: 8px;
  --radius-lg: 12px;
}
.theme-light {
  --bg-window: rgba(255, 253, 248, 0.92);
  --bg-card: #ffffff;
  --bg-track: #ece9e2;
  --bg-hover: rgba(198, 58, 85, 0.05);
  --bg-active: rgba(198, 58, 85, 0.08);
  --border-default: #e6e2da;
  --border-strong: #d5d1c8;
  --text-primary: #2e2c2a;
  --text-secondary: #5f5c56;
  --text-muted: #8c887f;
  --text-faint: #aaa69c;
  --text-dim: #c4c0b6;
  --primary: #c63a55;
  --primary-hover: #d04963;
  --primary-soft: rgba(198, 58, 85, 0.1);
  --primary-border: rgba(198, 58, 85, 0.35);
  --danger: #c24038;
  --danger-soft: rgba(194, 64, 56, 0.08);
  --danger-border: rgba(194, 64, 56, 0.3);
  --success: #2e8b62;
  --success-soft: rgba(46, 139, 98, 0.1);
  --accent-cyan: #0e9e92;
  --accent-cyan-soft: rgba(14, 158, 146, 0.12);
  --info: #2f6fc4;
  --info-soft: rgba(47, 111, 196, 0.1);
  --warning: #b8791a;
  --warning-soft: rgba(184, 121, 26, 0.1);
  --like: #c2407a;
  --like-soft: rgba(194, 64, 122, 0.1);
  --on-primary: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Microsoft YaHei UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background-color .25s ease, color .25s ease; }
body { color: var(--text-primary); }
#container {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  background: var(--bg-window); backdrop-filter: blur(12px);
  border-radius: var(--radius-lg); border: 1px solid var(--border-strong);
  overflow: hidden;
}
#titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; flex-shrink: 0; -webkit-app-region: drag;
  border-bottom: 1px solid var(--border-default);
}
#titlebar .title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
#titlebar .title .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent-cyan)); margin-right: 8px; vertical-align: middle; box-shadow: 0 0 6px var(--primary-border); }
#controls { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
#opacity { width: 70px; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border-strong); border-radius: 2px; outline: none; cursor: pointer; }
#opacity::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 6px var(--primary-border); }
.ctrl-btn {
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-card); color: var(--text-muted); cursor: pointer;
  transition: all .15s ease;
}
.ctrl-btn:hover { border-color: var(--primary-border); color: var(--primary); background: var(--primary-soft); }
.ctrl-btn.danger { color: var(--danger); border-color: var(--danger-border); }
.ctrl-btn.danger:hover { background: var(--danger-soft); }
.ctrl-btn.locked { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.ctrl-btn svg { width: 14px; height: 14px; }

/* Tab bar */
#tab-bar { display: flex; gap: 0; padding: 0 10px; flex-shrink: 0; border-bottom: 1px solid var(--border-default); overflow-x: auto; }
.tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 12px; padding: 8px 14px; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; transition: all .15s; -webkit-app-region: no-drag; white-space: nowrap; }
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* Room filter */
#room-bar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; flex-shrink: 0; flex-wrap: wrap; border-bottom: 1px solid var(--border-default); }
#room-bar .label { font-size: 10px; color: var(--text-faint); flex-shrink: 0; margin-right: 2px; }
.r-chip { border: 1px solid var(--border-strong); background: transparent; color: var(--text-muted); font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-family: inherit; transition: all .15s; -webkit-app-region: no-drag; }
.r-chip:hover { border-color: var(--primary-border); color: var(--text-secondary); }
.r-chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 500; }

/* Danmu list */
#list { flex: 1; overflow-y: scroll; padding: 4px; min-height: 0; }
.d-item { display: flex; align-items: center; padding: 5px 10px; margin: 2px 4px; border-radius: 6px; gap: 8px; transition: background .15s; }
.d-item:hover { background: var(--bg-hover); }
.d-gift { background: var(--primary-soft); border: 1px solid var(--primary-border); }
.d-gift:hover { background: var(--bg-active); }
.d-social { background: var(--info-soft); border: 1px solid var(--info-border); }
.d-time { font-size: 10px; color: var(--text-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.d-room-tag { font-size: 9px; color: var(--accent-cyan); padding: 1px 5px; border-radius: 3px; background: var(--accent-cyan-soft); flex-shrink: 0; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-tag { font-size: 10px; color: var(--on-primary); padding: 2px 8px; border-radius: 4px; flex-shrink: 0; font-weight: 500; min-width: 28px; text-align: center; }
.t-chat { background: var(--text-dim); }
.t-gift { background: var(--primary); }
.t-member { background: var(--success); }
.t-like { background: var(--danger); }
.t-social { background: var(--info); }
.d-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; word-break: break-all; flex: 1; min-width: 0; }
.d-user { color: var(--primary); font-weight: 500; }

/* 入场动画：新弹幕从底部滑入（列表/气泡形态） */
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
body[data-mode="list"] .d-item,
body[data-mode="bubble"] .d-item { animation: slideUp .18s ease-out; }

/* 气泡形态：聊天气泡卡片 */
body[data-mode="bubble"] .d-item {
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  border-radius: 12px 12px 12px 4px;
  padding: 6px 10px; margin: 4px 8px;
}
body[data-mode="bubble"] .d-gift { background: var(--primary-soft); border-color: var(--primary-border); }
body[data-mode="bubble"] .d-social { background: var(--info-soft); border-color: var(--info-border); }
body[data-mode="bubble"] .d-time { display: none; }

/* 飘字形态：弹幕从右侧向左横向滚动（经典直播飘字），多条自底部堆叠 */
body[data-mode="fly"] #list { position: relative; overflow: hidden; background: transparent; }
body[data-mode="fly"] .d-item {
  position: absolute; left: 0; right: 0;
  margin: 0; border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  padding: 5px 14px; width: fit-content; max-width: 92%;
  animation: flyIn 5.5s linear forwards;
  white-space: nowrap; overflow: hidden;
}
body[data-mode="fly"] .d-time { display: none; }
body[data-mode="fly"] .d-room-tag { display: none; }
@keyframes flyIn {
  from { transform: translateX(110%); opacity: 0; }
  8% { opacity: 1; }
  to { transform: translateX(-120%); opacity: 1; }
}

/* Empty state */
#empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 13px; color: var(--text-faint); display: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="container">
  <div id="titlebar">
    <span class="title"><span class="dot"></span>弹幕浮窗</span>
    <div id="controls">
      <input id="opacity" type="range" min="30" max="100" value="100" title="透明度">
      <button id="sizeBtn" class="ctrl-btn" title="切换尺寸：极小/小/中/大">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="modeBtn" class="ctrl-btn" title="切换形态：列表/飘字/气泡">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="4" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="15" width="18" height="4" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="latestBtn" class="ctrl-btn" title="回到最新弹幕">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="lockBtn" class="ctrl-btn" title="锁定（点击穿透）">
        <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button id="closeBtn" class="ctrl-btn danger" title="关闭">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="">全部</button>
    <button class="tab-btn" data-tab="Chat">弹幕</button>
    <button class="tab-btn" data-tab="Gift">礼物</button>
    <button class="tab-btn" data-tab="Like">点赞</button>
    <button class="tab-btn" data-tab="Member">进入</button>
    <button class="tab-btn" data-tab="Social">关注</button>
  </div>
  <div id="room-bar"><span class="label">房间:</span></div>
  <div id="list"></div>
  <div id="empty">暂无弹幕消息</div>
</div>
<script>
const { ipcRenderer } = require('electron')
const list = document.getElementById('list')
const roomBar = document.getElementById('room-bar')
const emptyEl = document.getElementById('empty')
const MAX = 30
const labels = { Chat: '弹幕', Gift: '礼物', Like: '点赞', Member: '进入', Social: '关注' }
let filterType = ''
let filterRoomId = ''
let allMsgs = []
let autoScroll = true
let rooms = []

// ===== 尺寸预设 4 档（极小/小/中/大，保持左上角，持久化） =====
const SIZES = [
  { label: '极小', w: 240, h: 240 },
  { label: '小', w: 320, h: 320 },
  { label: '中', w: 480, h: 420 },
  { label: '大', w: 640, h: 560 },
]
let sizeIdx = parseInt(localStorage.getItem('float-size') || '2', 10)
sizeIdx = isNaN(sizeIdx) ? 2 : Math.max(0, Math.min(SIZES.length - 1, sizeIdx))
document.getElementById('sizeBtn').onclick = () => {
  sizeIdx = (sizeIdx + 1) % SIZES.length
  localStorage.setItem('float-size', String(sizeIdx))
  ipcRenderer.send('floating:resize', SIZES[sizeIdx])
  document.getElementById('sizeBtn').title = '尺寸：' + SIZES[sizeIdx].label
}

// ===== 形态 3 种（列表/飘字/气泡，持久化） =====
const MODES = ['list', 'fly', 'bubble']
const MODE_NAMES = { list: '列表', fly: '飘字', bubble: '气泡' }
let modeIdx = parseInt(localStorage.getItem('float-mode') || '0', 10)
modeIdx = isNaN(modeIdx) ? 0 : Math.max(0, Math.min(MODES.length - 1, modeIdx))
let flyCount = 0  // 飘字模式底部堆叠序号
function applyMode() {
  document.body.setAttribute('data-mode', MODES[modeIdx])
  const btn = document.getElementById('modeBtn')
  btn.title = '形态：' + (MODE_NAMES[MODES[modeIdx]] || MODES[modeIdx]) + '（点击切换）'
  // 切回列表/气泡时清掉残留的飘字条
  if (MODES[modeIdx] !== 'fly') list.querySelectorAll('.d-item.fly').forEach(el => el.remove())
}
document.getElementById('modeBtn').onclick = () => {
  modeIdx = (modeIdx + 1) % MODES.length
  localStorage.setItem('float-mode', String(modeIdx))
  applyMode()
}
applyMode()
document.getElementById('sizeBtn').title = '尺寸：' + SIZES[sizeIdx].label

list.addEventListener('scroll', () => {
  autoScroll = list.scrollTop + list.clientHeight >= list.scrollHeight - 20
})

function buildRoomChips() {
  let html = '<span class="label">房间:</span>'
  html += '<button class="r-chip' + (filterRoomId === '' ? ' active' : '') + '" data-room="">全部</button>'
  rooms.forEach(r => {
    html += '<button class="r-chip' + (filterRoomId === r.roomId ? ' active' : '') + '" data-room="' + r.roomId + '">' + esc(r.nickname) + '</button>'
  })
  roomBar.innerHTML = html
  roomBar.querySelectorAll('.r-chip').forEach(chip => {
    chip.onclick = () => {
      roomBar.querySelectorAll('.r-chip').forEach(c => c.classList.remove('active'))
      chip.classList.add('active')
      filterRoomId = chip.dataset.room
      renderList()
    }
  })
}

document.getElementById('tab-bar').querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    filterType = btn.dataset.tab
    renderList()
  }
})

function timeStr() { const d = new Date(); return d.toTimeString().substring(0, 8) }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML }

function scrollBottom() {
  requestAnimationFrame(() => {
    if (autoScroll) list.scrollTop = list.scrollHeight
    requestAnimationFrame(() => {
      if (autoScroll) list.scrollTop = list.scrollHeight
    })
  })
}

function goLatest() {
  autoScroll = true
  list.scrollTop = list.scrollHeight
}

function renderList() {
  list.innerHTML = ''
  let msgs = allMsgs
  if (filterType) msgs = msgs.filter(m => m.type === filterType)
  if (filterRoomId) msgs = msgs.filter(m => m.roomId === filterRoomId)
  const shown = msgs.slice(-MAX)
  shown.forEach(msg => appendRow(msg))
  emptyEl.style.display = shown.length === 0 ? 'block' : 'none'
  scrollBottom()
}

function appendRow(msg) {
  const item = document.createElement('div')
  item.className = 'd-item' + (msg.type === 'Gift' ? ' d-gift' : '') + (msg.type === 'Social' ? ' d-social' : '')
  const time = document.createElement('span'); time.className = 'd-time'; time.textContent = timeStr()
  const roomTag = document.createElement('span'); roomTag.className = 'd-room-tag'; roomTag.textContent = msg.roomNickname || ''
  const tag = document.createElement('span'); tag.className = 'd-tag t-' + (msg.type || 'chat').toLowerCase(); tag.textContent = labels[msg.type] || msg.type || '弹幕'
  const text = document.createElement('span'); text.className = 'd-text'
  const user = document.createElement('span'); user.className = 'd-user'; user.textContent = (msg.userName || '未知') + ' '
  text.appendChild(user)
  if (msg.type === 'Chat') text.appendChild(document.createTextNode(msg.content || ''))
  else if (msg.type === 'Gift') text.appendChild(document.createTextNode('赠送 ' + esc(msg.giftName || '礼物') + ' x' + (msg.giftCount || 1)))
  else if (msg.type === 'Member') text.appendChild(document.createTextNode('进入直播间'))
  else if (msg.type === 'Like') text.appendChild(document.createTextNode('点赞了' + (msg.likeCount || 1) + '次'))
  else if (msg.type === 'Social') text.appendChild(document.createTextNode('关注了主播'))
  else text.appendChild(document.createTextNode(msg.content || ''))
  item.appendChild(time); item.appendChild(roomTag); item.appendChild(tag); item.appendChild(text)
  list.appendChild(item)

  // 飘字形态：横向滚动动画结束后自动移除，最多保留 6 条堆叠
  if (MODES[modeIdx] === 'fly') {
    item.classList.add('fly')
    flyCount = (flyCount + 1) % 6
    item.style.bottom = (flyCount * 26) + 'px'
    const flying = list.querySelectorAll('.d-item.fly')
    if (flying.length > 6) flying[0].remove()
    setTimeout(() => { if (item.isConnected) item.remove() }, 5600)
  }
}

ipcRenderer.on('floating:danmu', (_e, msg) => {
  allMsgs.push(msg)
  if (allMsgs.length > MAX * 3) allMsgs = allMsgs.slice(-MAX * 3)
  if ((!filterType || filterType === msg.type) && (!filterRoomId || filterRoomId === msg.roomId)) {
    appendRow(msg)
    while (list.children.length > MAX) list.removeChild(list.firstChild)
    scrollBottom()
  }
})

// 回放开始前清空列表（只滚回放文件夹里的弹幕，不混直播/上一次回放）
ipcRenderer.on('floating:clear', () => {
  allMsgs = []
  list.innerHTML = ''
  emptyEl.style.display = 'block'
})

ipcRenderer.on('floating:rooms', (_e, newRooms) => {
  rooms = newRooms || []
  buildRoomChips()
})

// 主题切换：主进程通知时切 html class
ipcRenderer.on('floating:theme', (_e, mode) => {
  document.documentElement.classList.toggle('theme-dark', mode === 'dark')
  document.documentElement.classList.toggle('theme-light', mode === 'light')
})
// 启动时询问当前主题
ipcRenderer.send('floating:get-theme')

document.getElementById('closeBtn').onclick = () => ipcRenderer.send('floating:action', 'close')
document.getElementById('opacity').oninput = (e) => ipcRenderer.send('floating:action', 'opacity', e.target.value / 100)
document.getElementById('latestBtn').onclick = () => goLatest()

const lockBtn = document.getElementById('lockBtn')
let locked = false
let hoverUnlocked = false
lockBtn.onclick = () => {
  locked = !locked
  lockBtn.classList.toggle('locked', locked)
  lockBtn.title = locked ? '已锁定（鼠标移到此处可解锁）' : '锁定（点击穿透）'
  ipcRenderer.send('floating:action', locked ? 'lock' : 'unlock')
}
document.addEventListener('mousemove', (e) => {
  if (!locked) return
  const r = lockBtn.getBoundingClientRect()
  const near = e.clientX >= r.left - 30 && e.clientX <= r.right + 30 && e.clientY >= r.top - 30 && e.clientY <= r.bottom + 30
  if (near && !hoverUnlocked) { hoverUnlocked = true; ipcRenderer.send('floating:action', 'hover-unlock') }
  else if (!near && hoverUnlocked) { hoverUnlocked = false; ipcRenderer.send('floating:action', 'hover-lock') }
})

// 位置/大小记忆：变化时通知主进程
let saveBoundsTimer = null
function saveBounds() {
  clearTimeout(saveBoundsTimer)
  saveBoundsTimer = setTimeout(() => {
    const { screenX, screenY, outerWidth, outerHeight } = window
    ipcRenderer.send('floating:save-bounds', { x: screenX, y: screenY, w: outerWidth, h: outerHeight })
  }, 500)
}
window.addEventListener('resize', saveBounds)
</script>
</body>
</html>
