<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#x5361;&#x5BC6;&#x7BA1;&#x7406;</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111318;color:#e0e2e8;font-family:"Microsoft YaHei UI",system-ui,sans-serif;padding:20px}
.card{background:#1a1d26;border:1px solid #2a2d36;border-radius:16px;padding:36px;max-width:480px;margin:20px auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;text-align:center;color:#f97316}
h2{font-size:14px;color:#e0e2e8}
label{font-size:12px;color:#6b7080;display:block;margin-bottom:4px}
input,select{background:#111318;border:1px solid #2a2d36;border-radius:8px;padding:10px 14px;color:#e0e2e8;font-size:14px;font-family:inherit;outline:none;width:100%;box-sizing:border-box}
input:focus,select:focus{border-color:#f97316}
.btn{background:#f97316;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn:hover{background:#fb923c}
.btn-d{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;text-align:center;font-family:inherit}
.btn-d:hover{background:#dc2626}
.btn-s{background:transparent;border:1px solid #2a2d36;color:#6b7080;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-s:hover{border-color:#f97316;color:#f97316}
.r{display:none;background:#111318;border:1px solid #2a2d36;border-radius:8px;padding:14px;margin-top:4px}
.r.s{display:block}
.k{font-family:monospace;font-size:13px;color:#f97316;word-break:break-all;margin-bottom:8px}
.i{font-size:11px;color:#6b7080;margin-bottom:4px}
.c{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);color:#fb923c;font-size:11px;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:inherit;margin-top:6px}
.p{background:#111318;border:1px solid #2a2d36;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;color:#6b7080;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto;margin-top:4px}
hr{border:none;border-top:1px solid #2a2d36;margin:8px 0}
.w{font-size:10px;color:#3a3d46;text-align:center}
.stat{font-size:12px;color:#6b7080}
.stat span{color:#f97316;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>&#x5361;&#x5BC6;&#x7BA1;&#x7406;</h1>

<h2>&#x751F;&#x6210;&#x5361;&#x5BC6;</h2>
<label>&#x7528;&#x6237; ID</label>
<input id="uid" placeholder="vip001" autofocus>
<label>&#x6709;&#x6548;&#x671F;</label>
<select id="days">
<option value="7">7 &#x5929;</option>
<option value="30" selected>30 &#x5929;</option>
<option value="90">90 &#x5929;</option>
<option value="180">180 &#x5929;</option>
<option value="365">365 &#x5929;&#xFF08;1&#x5E74;&#xFF09;</option>
<option value="730">730 &#x5929;&#xFF08;2&#x5E74;&#xFF09;</option>
</select>
<div class="btn" onclick="gen()">&#x751F;&#x6210;&#x5361;&#x5BC6;</div>
<div class="r" id="gr">
<div class="k" id="kt"></div>
<div class="i" id="it"></div>
<button class="c" onclick="cp()">&#x590D;&#x5236;</button>
</div>

<hr>

<h2>&#x5DF2;&#x751F;&#x6210;&#x8BB0;&#x5F55;</h2>
<div style="display:flex;justify-content:space-between;align-items:center;">
<span class="stat">&#x5171; <span id="kc">0</span> &#x5F20;&#x5361;&#x5BC6;</span>
<button class="btn-s" onclick="ek()">&#x5BFC;&#x51FA; JSON</button>
</div>
<div class="p" id="kp"></div>

<hr>

<h2>&#x5214;&#x9500;&#x5361;&#x5BC6;</h2>
<label>&#x8F93;&#x5165;&#x5B8C;&#x6574;64&#x4F4D;&#x5361;&#x5BC6;</label>
<input id="ri" style="font-family:monospace">
<div class="btn-d" onclick="rv()">&#x5214;&#x9500;&#x6B64;&#x5361;&#x5BC6;</div>
<div id="rm"></div>
<div id="rs" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
<span style="font-size:12px;color:#ef4444;">&#x5DF2;&#x5214;&#x9500;&#x5217;&#x8868;&#xFF08;&#x5171; <span id="rc">0</span> &#x6761;&#xFF09;</span>
<button class="btn-s" onclick="er()">&#x5BFC;&#x51FA;</button>
</div>
<div class="p" id="rp"></div>
</div>

<div class="w">&#x6B64;&#x5DE5;&#x5177;&#x4EC5;&#x4F9B;&#x672C;&#x5730;&#x4F7F;&#x7528;</div>
</div>

<script>
var S="dylive-kms-2026-secret-key-v1",B=new Date("2025-01-01").getTime();

function ld(){try{return JSON.parse(localStorage.getItem("kd"))||{k:[],r:[]}}catch(e){return{k:[],r:[]}}}
function sd(d){localStorage.setItem("kd",JSON.stringify(d))}

// ===== &#x751F;&#x6210;&#xFF08;&#x4E0E; &#x5361;&#x5BC6;&#x751F;&#x6210;&#x5668;.html &#x5B8C;&#x5168;&#x4E00;&#x81F4;&#xFF09; =====
function gen() {
  var uid = document.getElementById("uid").value.trim()
  if (!uid) return alert("&#x8BF7;&#x8F93;&#x5165;&#x7528;&#x6237; ID")
  var days = parseInt(document.getElementById("days").value)
  if (isNaN(days)) return
  var expires = new Date(Date.now() + days * 86400000)
  var expireDays = Math.floor((expires.getTime() - B) / 86400000)
  var payload = new Uint8Array(2 + new TextEncoder().encode(uid).length)
  var view = new DataView(payload.buffer)
  view.setUint16(0, expireDays, false)
  new TextEncoder().encodeInto(uid, payload.subarray(2))
  var keyData = new TextEncoder().encode(S)
  crypto.subtle.importKey("raw", keyData, { name: "HMAC", hash: "SHA-256" }, false, ["sign"])
    .then(function(key){return crypto.subtle.sign("HMAC", key, payload)})
    .then(function(sig){
      var raw = new Uint8Array(payload.length + sig.byteLength)
      raw.set(payload)
      raw.set(new Uint8Array(sig), payload.length)
      var b64 = btoa(String.fromCharCode(...raw))
        .replace(/\+/g, "-").replace(/\//g,"_").replace(/=+$/, "")
      document.getElementById("kt").textContent = b64
      var until = expires.toISOString().substring(0, 10)
      document.getElementById("it").textContent = "&#x7528;&#x6237;: " + uid + "  &#x6709;&#x6548;&#x671F;: " + days + "&#x5929;  &#x81F3;" + until
      document.getElementById("gr").classList.add("s")
      // &#x4FDD;&#x5B58;&#x5230;&#x672C;&#x5730;
      var db = ld()
      db.k.push({key:b64, uid:uid, days:days, created:new Date().toISOString()})
      sd(db)
      rk()
    })
}

function cp() {
  var k = document.getElementById("kt").textContent
  if (!k) return
  navigator.clipboard.writeText(k).then(function(){
    var btn = event.target
    btn.textContent = "&#x5DF2;&#x590D;&#x5236;"
    setTimeout(function(){btn.textContent = "&#x590D;&#x5236;"}, 1500)
  })
}

// ===== SHA256 =====
function sh(t) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t))
    .then(function(b){return Array.from(new Uint8Array(b)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")})
}

// ===== &#x5214;&#x9500; =====
function rv() {
  var inp = document.getElementById("ri").value.trim()
  if (!inp) return
  if (!confirm("&#x786E;&#x5B9A;&#x5214;&#x9500;&#xFF1F;")) return
  sh(inp).then(function(hash){
    var db = ld()
    if (db.r.indexOf(hash) >= 0) {
      document.getElementById("rm").innerHTML = '<div style="margin-top:8px;font-size:12px;color:#ef4444;">&#x5DF2;&#x5728;&#x5214;&#x9500;&#x5217;&#x8868;&#x4E2D;</div>'
      return
    }
    db.r.push(hash)
    sd(db)
    document.getElementById("ri").value = ""
    document.getElementById("rm").innerHTML = '<div style="margin-top:8px;font-size:12px;color:#10b981;">&#x5DF2;&#x5214;&#x9500;</div>'
    setTimeout(function(){document.getElementById("rm").innerHTML = ""}, 3000)
    rr()
  })
}

function rr() {
  var db = ld(), s = document.getElementById("rs"), c = document.getElementById("rc"), p = document.getElementById("rp")
  c.textContent = db.r.length
  if (db.r.length > 0) {s.style.display = "block"; p.textContent = JSON.stringify(db.r, null, 2)}
  else {s.style.display = "none"}
}

function er() {
  var db = ld(), b = new Blob([JSON.stringify(db.r, null, 2)], {type:"application/json"}), a = document.createElement("a")
  a.href = URL.createObjectURL(b); a.download = "revoked_list.json"; a.click()
}

// ===== &#x8BB0;&#x5F55; =====
function rk() {
  var db = ld(), c = document.getElementById("kc"), p = document.getElementById("kp")
  c.textContent = db.k.length
  if (db.k.length > 0) {
    var lines = db.k.map(function(k, i){return (i+1) + ". " + k.key + " (" + k.uid + ", " + k.days + "&#x5929;)"})
    p.textContent = lines.join("\n")
  } else {
    p.textContent = ""
  }
}

function ek() {
  var db = ld(), b = new Blob([JSON.stringify(db.k, null, 2)], {type:"application/json"}), a = document.createElement("a")
  a.href = URL.createObjectURL(b); a.download = "keys_backup.json"; a.click()
}

// ===== &#x521D;&#x59CB;&#x5316; =====
rk(); rr()
</script>
</body>
</html>
