<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111318;color:#e0e2e8;font-family:'Microsoft YaHei UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#1a1d26;border:1px solid #2a2d36;border-radius:16px;padding:40px 36px;width:420px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;text-align:center;color:#f97316}
.row{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;color:#6b7080}
input,select{background:#111318;border:1px solid #2a2d36;border-radius:8px;padding:10px 14px;color:#e0e2e8;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#f97316}
.btn{background:#f97316;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn:hover{background:#fb923c}
.result{display:none;background:#111318;border:1px solid #2a2d36;border-radius:8px;padding:14px}
.result.show{display:block}
.result .key{font-family:monospace;font-size:13px;color:#f97316;word-break:break-all;margin-bottom:8px}
.result .info{font-size:11px;color:#6b7080}
.copy-btn{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);color:#fb923c;font-size:11px;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:inherit;margin-top:6px}
.copy-btn:hover{background:rgba(249,115,22,0.2)}
.warn{font-size:10px;color:#3a3d46;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 卡密生成器</h1>
  <div class="row">
    <label>用户 ID</label>
    <input id="uid" placeholder="例如: vip001" autofocus>
  </div>
  <div class="row">
    <label>有效期</label>
    <select id="days">
      <option value="7">7 天</option>
      <option value="30" selected>30 天</option>
      <option value="90">90 天</option>
      <option value="180">180 天</option>
      <option value="365">365 天（1年）</option>
      <option value="730">730 天（2年）</option>
      <option value="9999">永久</option>
    </select>
  </div>
  <button class="btn" onclick="generate()">生成卡密</button>
  <div class="result" id="result">
    <div class="key" id="keyText"></div>
    <div class="info" id="infoText"></div>
    <button class="copy-btn" onclick="copyKey()">📋 复制卡密</button>
  </div>
  <div class="warn">⚠ 此工具仅供本地使用，请勿泄露</div>
</div>

<script>
function generate() {
  const uid = document.getElementById('uid').value.trim()
  if (!uid) return alert('请输入用户 ID')

  // HMAC-SHA256 key generation (same as gen-key.js)
  const SECRET = 'dylive-kms-2026-secret-key-v1'
  const days = parseInt(document.getElementById('days').value)
  const BASE = new Date('2025-01-01').getTime()
  const expires = new Date(Date.now() + days * 86400000)
  const expireDays = Math.floor((expires.getTime() - BASE) / 86400000)

  // Pack: 2 bytes expiry + userId
  const payload = new Uint8Array(2 + new TextEncoder().encode(uid).length)
  const view = new DataView(payload.buffer)
  view.setUint16(0, expireDays, false)
  new TextEncoder().encodeInto(uid, payload.subarray(2))

  // HMAC
  const encoder = new TextEncoder()
  const keyData = encoder.encode(SECRET)
  crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
    .then(key => crypto.subtle.sign('HMAC', key, payload))
    .then(sig => {
      const raw = new Uint8Array(payload.length + sig.byteLength)
      raw.set(payload)
      raw.set(new Uint8Array(sig), payload.length)
      const b64 = btoa(String.fromCharCode(...raw))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      const until = expires.toISOString().substring(0, 10)
      document.getElementById('keyText').textContent = b64
      document.getElementById('infoText').textContent = `用户: ${uid}  ·  有效期: ${days}天  ·  至 ${until}`
      document.getElementById('result').classList.add('show')
    })
}

function copyKey() {
  const key = document.getElementById('keyText').textContent
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.querySelector('.copy-btn')
    btn.textContent = '✅ 已复制'
    setTimeout(() => btn.textContent = '📋 复制卡密', 1500)
  })
}
</script>
</body>
</html>
