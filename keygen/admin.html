<script>
const SECRET = "dylive-kms-2026-secret-key-v1";
const BASE = new Date("2025-01-01").getTime();

async function generateKey(userId, days) {
  const enc = new TextEncoder();
  const payload = new Uint8Array(2 + enc.encode(userId).length);
  const expireDays = Math.floor((Date.now() + days*86400000 - BASE)/86400000);
  payload[0] = (expireDays>>8)&0xFF; payload[1] = expireDays&0xFF;
  for(let i=0;i<userId.length;i++) payload[2+i]=userId.charCodeAt(i);
  const key = await crypto.subtle.importKey("raw", enc.encode(SECRET), {name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const hmac = new Uint8Array(await crypto.subtle.sign("HMAC",key,payload));
  const c = new Uint8Array(payload.length+32); c.set(payload); c.set(hmac,payload.length);
  return btoa(String.fromCharCode(...c)).replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/,"");
}

function sha256(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(b=>Array.from(new Uint8Array(b)).map(b=>b.toString(16).padStart(2,"0")).join(""));}

function loadDB(){try{return JSON.parse(localStorage.getItem("keys_db"))||{keys:[],revoked:[]}}catch{return{keys:[],revoked:[]}}}
function saveDB(d){localStorage.setItem("keys_db",JSON.stringify(d))}

function switchTab(n){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.querySelector(\'.tab[onclick*="\'+n+\'"]\').classList.add("active");document.getElementById("panel-"+n).classList.add("active");if(n=="list")renderTable();if(n=="revoke")renderRevoked()}

async function generateKeys(){
  const c=parseInt(document.getElementById("genCount").value)||1;
  const d=parseInt(document.getElementById("genDays").value)||30;
  const u=document.getElementById("genUser").value||"user";
  const db=loadDB();
  const gens=[];
  for(let i=0;i<c;i++){
    const uid=c>1?u+"_"+(i+1):u;
    const ea=new Date(Date.now()+d*86400000);
    const k=await generateKey(uid,d);
    gens.push(k);
    db.keys.push({key:k,userId:uid,days:d,maxDevices:1,status:"active",created_at:new Date().toISOString().slice(0,19).replace("T"," "),expires_at:ea.toISOString().slice(0,10)});
  }
  saveDB(db);
  document.getElementById("genResult").innerHTML=\'<div class="msg ok">\'+c+\' ??????</div><div class="preview">\'+gens.map((k,i)=>(i+1)+". "+k).join("\\n")+"</div>";
  renderTable();
}

function renderTable(){
  const db=loadDB();
  const tb=document.getElementById("keyTable");
  const st=document.getElementById("keyStats");
  st.innerHTML="?? <span>"+db.keys.length+"</span>";
  if(!db.keys.length){tb.innerHTML=\'<tr><td colspan="6" class="empty">????</td></tr>\';return}
  tb.innerHTML=[...db.keys].reverse().map(k=>{
    const ir=db.revoked.includes(k.key)||k.status=="revoked";
    const ie=!ir&&k.expires_at&&new Date(k.expires_at)<new Date();
    const sb=ir?"???":ie?"???":"??";
    const sc=ir?"revoked":ie?"expired":"active";
    return \'<tr><td class="key-text">\'+k.key.slice(0,24)+\'...</td><td>\'+k.userId+\'</td><td>\'+k.days+\'</td><td><span class="badge \'+sc+\'">\'+sb+\'</span></td><td>\'+(k.expires_at||"-")+\'</td><td>\'+(ir?"-":\'<button class="sm danger" onclick="revokeKey(\\\'\'+k.key+\'\\\')">??</button>\')+"</td></tr>";
  }).join("");
}

async function revokeKey(key){
  if(!confirm("?????"))return;
  const db=loadDB();
  const hash=await sha256(key);
  if(!db.revoked.includes(key))db.revoked.push(key);
  const idx=db.keys.findIndex(k=>k.key===key);
  if(idx>=0)db.keys[idx].status="revoked";
  saveDB(db);renderTable();renderRevoked();
}

async function revokeKeyByInput(){
  const inp=document.getElementById("revokeInput").value.trim();
  if(!inp)return;
  const hash=await sha256(inp);
  const db=loadDB();
  if(!db.revoked.includes(inp))db.revoked.push(inp);
  const idx=db.keys.findIndex(k=>k.key===inp);
  if(idx>=0)db.keys[idx].status="revoked";
  saveDB(db);
  document.getElementById("revokeInput").value="";
  document.getElementById("revokeResult").innerHTML=\'<div class="msg ok">???<br>SHA256: \'+hash+"</div>";
  renderTable();renderRevoked();
}

async function exportRevoked(){
  const db=loadDB();
  const hashes=[];
  for(const key of db.revoked){
    hashes.push(await sha256(key));
  }
  const blob=new Blob([JSON.stringify(hashes,null,2)],{type:"application/json"});
