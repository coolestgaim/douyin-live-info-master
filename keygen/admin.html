<script>
const SECRET = 'dylive-kms-2026-secret-key-v1'
const BASE = new Date('2025-01-01').getTime()

// ??/????
function loadDB() {
  try { return JSON.parse(localStorage.getItem('keys_db')) || {keys:[], revoked:[]} }
  catch { return {keys:[], revoked:[]} }
}
function saveDB(d) { localStorage.setItem('keys_db', JSON.stringify(d)) }

// ????
function generate() {
  const uid = document.getElementById('uid').value.trim()
  if (!uid) return alert('????? ID')
  const days = parseInt(document.getElementById('days').value)
  if (isNaN(days)) return
  const expires = new Date(Date.now() + days * 86400000)
  const expireDays = Math.floor((expires.getTime() - BASE) / 86400000)
  const payload = new Uint8Array(2 + new TextEncoder().encode(uid).length)
  const view = new DataView(payload.buffer)
  view.setUint16(0, expireDays, false)
  new TextEncoder().encodeInto(uid, payload.subarray(2))

  const keyData = new TextEncoder().encode(SECRET)
  crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
    .then(key => crypto.subtle.sign('HMAC', key, payload))
    .then(sig => {
      const raw = new Uint8Array(payload.length + sig.byteLength)
      raw.set(payload)
      raw.set(new Uint8Array(sig), payload.length)
      const b64 = btoa(String.fromCharCode.apply(null, raw))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      const until = expires.toISOString().substring(0, 10)
      document.getElementById('keyText').textContent = b64
      document.getElementById('infoText').textContent = '??: '+uid+' ? ???: '+days+'? ? ? '+until
      document.getElementById('genResult').classList.add('show')

      // ?????
      const db = loadDB()
      db.keys.push({key:b64, uid:uid, days:days, created:new Date().toISOString()})
      saveDB(db)
    })
}

function copyKey() {
  const key = document.getElementById('keyText').textContent
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.querySelector('.copy-btn')
    btn.textContent = '???'
    setTimeout(() => btn.textContent = '????', 1500)
  })
}

// SHA256 ??
async function sha256(text) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
  return Array.from(new Uint8Array(b)).map(b => b.toString(16).padStart(2,'0')).join('')
}

// ??
async function revokeKey() {
  const inp = document.getElementById('revokeInput').value.trim()
  if (!inp) return alert('?????????')
  if (!confirm('????????')) return

  const hash = await sha256(inp)
  const db = loadDB()
  if (db.revoked.indexOf(hash) >= 0) {
    document.getElementById('revokeMsg').innerHTML = '<div style="margin-top:8px;font-size:12px;color:#ef4444;">??????????</div>'
    return
  }
  db.revoked.push(hash)
  saveDB(db)

  document.getElementById('revokeInput').value = ''
  document.getElementById('revokeMsg').innerHTML = '<div style="margin-top:8px;font-size:12px;color:#10b981;">????SHA256: '+hash+'</div>'
  setTimeout(() => document.getElementById('revokeMsg').innerHTML = '', 3000)
  renderRevoked()
}

// ???????
function renderRevoked() {
  const db = loadDB()
  const section = document.getElementById('revokedSection')
  const count = document.getElementById('revokeCount')
  const preview = document.getElementById('revokedPreview')
  count.textContent = db.revoked.length
  if (db.revoked.length > 0) {
    section.style.display = 'block'
    preview.textContent = JSON.stringify(db.revoked, null, 2)
  } else {
    section.style.display = 'none'
  }
}

// ?? revoked_list.json
async function exportRevoked() {
  const db = loadDB()
  // ???? revoked keys ? SHA256 ??
  const blob = new Blob([JSON.stringify(db.revoked, null, 2)], {type:'application/json'})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url; a.download = 'revoked_list.json'; a.click()
  URL.revokeObjectURL(url)
}

renderRevoked()
</script>
