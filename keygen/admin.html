<script>
// ========== HMAC-SHA256 ?????? gen-key.js ??? ==========
const SECRET = 'dylive-kms-2026-secret-key-v1';
const BASE = new Date('2025-01-01').getTime();

async function generateKey(userId, days) {
  const enc = new TextEncoder();
  const payload = new Uint8Array(2 + enc.encode(userId).length);
  const expireDays = Math.floor((Date.now() + days * 86400000 - BASE) / 86400000);
  payload[0] = (expireDays >> 8) & 0xFF;
  payload[1] = expireDays & 0xFF;
  for (let i = 0; i < userId.length; i++) payload[2 + i] = userId.charCodeAt(i);

  const key = await crypto.subtle.importKey('raw', enc.encode(SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const hmac = await crypto.subtle.sign('HMAC', key, payload);

  const combined = new Uint8Array(payload.length + 32);
  combined.set(payload);
  combined.set(new Uint8Array(hmac), payload.length);

  return btoa(String.fromCharCode(...combined))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
    .then(b => Array.from(new Uint8Array(b)).map(b => b.toString(16).padStart(2, '0')).join(''));
}

function loadDB() {
  try { return JSON.parse(localStorage.getItem('keys_db')) || { keys: [], revoked: [] }; }
  catch { return { keys: [], revoked: [] }; }
}
function saveDB(db) {
  localStorage.setItem('keys_db', JSON.stringify(db));
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'list') renderTable();
  if (name === 'revoke') renderRevoked();
}

async function generateKeys() {
  const count = parseInt(document.getElementById('genCount').value) || 1;
  const days = parseInt(document.getElementById('genDays').value) || 30;
  const userId = document.getElementById('genUser').value || 'user';
  const result = document.getElementById('genResult');
  result.innerHTML = '<div class="msg" style="color:#6b7080;">???...</div>';

  const db = loadDB();
  const generated = [];
  for (let i = 0; i < count; i++) {
    const uid = count > 1 ? userId + '_' + (i + 1) : userId;
    const expiresAt = new Date(Date.now() + days * 86400000);
    const key = await generateKey(uid, days);
    generated.push(key);
    db.keys.push({
      key, userId: uid, days, maxDevices: 1, status: 'active',
      created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
      expires_at: expiresAt.toISOString().slice(0, 10)
    });
  }
  saveDB(db);

  result.innerHTML = '<div class="msg ok">? ??? ' + count + ' ???</div><div class="preview">' +
    generated.map((k, i) => `${i+1}. ${k}`).join('\n') + '</div>';
  renderTable();
}

// ========== ?????? ==========
function renderTable() {
  const db = loadDB();
  const tbody = document.getElementById('keyTable');
  const stats = document.getElementById('keyStats');

  const total = db.keys.length;
  const active = db.keys.filter(k => k.status === 'active').length;
  const revoked = db.keys.filter(k => db.revoked.includes(k.key) || k.status === 'revoked').length;
  stats.innerHTML = `?? <span>${total}</span> ? ?? <span>${active}</span> ? ?? <span>${revoked}</span>`;

  if (total === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">??????????????????</td></tr>';
    return;
  }

  // ???????
  const sorted = [...db.keys].reverse();
  tbody.innerHTML = sorted.map(k => {
    const isRevoked = db.revoked.includes(k.key) || k.status === 'revoked';
    const isExpired = !isRevoked && k.expires_at && new Date(k.expires_at) < new Date();
    const statusBadge = isRevoked ? '<span class="badge revoked">???</span>'
      : isExpired ? '<span class="badge expired">???</span>'
      : '<span class="badge active">??</span>';
    return `<tr>
      <td class="key-text">${k.key.slice(0, 24)}...</td>
      <td>${k.userId}</td>
      <td>${k.days}</td>
      <td>${statusBadge}</td>
      <td>${k.expires_at || '-'}</td>
      <td>${!isRevoked ? '<button class="sm danger" onclick="revokeKey(\'' + k.key + '\')">??</button>' : '-'}</td>
    </tr>`;
  }).join('');
}

// ========== ?? ==========
async function revokeKey(key) {
  if (!confirm('????????')) return;
  const db = loadDB();
  const hash = await sha256(key);
  if (!db.revoked.includes(hash)) db.revoked.push(hash);
  const idx = db.keys.findIndex(k => k.key === key);
  if (idx >= 0) db.keys[idx].status = 'revoked';
  saveDB(db);
  renderTable();
  document.getElementById('revokeResult').innerHTML = '<div class="msg ok">??????</div>';
  setTimeout(() => document.getElementById('revokeResult').innerHTML = '', 3000);
}

async function revokeKeyByInput() {
  const input = document.getElementById('revokeInput').value.trim();
  if (!input) return;
  const hash = await sha256(input);
  const db = loadDB();
  if (!db.revoked.includes(hash)) db.revoked.push(hash);
  const idx = db.keys.findIndex(k => k.key === input);
  if (idx >= 0) db.keys[idx].status = 'revoked';
  saveDB(db);
  document.getElementById('revokeInput').value = '';
  document.getElementById('revokeResult').innerHTML = '<div class="msg ok">? ???<br>SHA256: ' + hash + '</div>';
  renderTable();
  renderRevoked();
}
